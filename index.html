<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semanas de Pau</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤰</text></svg>">
<style>
  :root {
    --bg: #f3e9b8;
    --card: #fbf8ec;
    --text: #2f3a3c;
    --muted: #7f8687;
    --accent: #2b8a96;
    --track: #c9cccb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a2526;
      --card: #243233;
      --text: #f1ead0;
      --muted: #a3aaa9;
      --accent: #4fb3bf;
      --track: #3b4748;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  main {
    background: var(--card);
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.06);
  }
  h1 { font-size: 1.1rem; font-weight: 500; color: var(--muted); margin: 0 0 24px; }
  .weeks { font-size: 4.5rem; font-weight: 700; color: var(--accent); line-height: 1; }
  .weeks small { font-size: 1.2rem; font-weight: 500; color: var(--text); display: block; margin-top: 8px; }
  .months { font-size: 1.4rem; margin: 28px 0; }
  .bar { height: 10px; background: var(--track); border-radius: 99px; overflow: hidden; }
  .bar div { height: 100%; background: var(--accent); border-radius: 99px; }
  .meta { color: var(--muted); font-size: .9rem; margin-top: 16px; line-height: 1.6; }

  .poll { padding: 28px 24px; text-align: left; }
  .poll h2 { font-size: 1rem; font-weight: 600; margin: 0 0 4px; }
  .poll .hint { color: var(--muted); font-size: .85rem; margin: 0 0 16px; }
  .row { display: block; width: 100%; padding: 6px 8px; margin: 0 -8px 4px; border: 0; border-radius: 10px;
         background: none; color: inherit; font: inherit; text-align: left; cursor: default; position: relative; }
  .poll.voting .row { cursor: pointer; }
  @media (hover: hover) { .poll.voting .row:hover { background: var(--bg); } }
  .row.sel { box-shadow: inset 0 0 0 2px var(--accent); }
  .row.sel b::before { content: '✓ '; color: var(--accent); }
  .row .top { display: flex; justify-content: space-between; font-size: .95rem; margin-bottom: 4px; }
  .row .top b { font-weight: 600; }
  .row .bar { height: 6px; }
  .row .who { display: none; position: absolute; left: 8px; bottom: calc(100% - 2px); z-index: 1;
              background: var(--text); color: var(--card); font-size: .8rem; padding: 4px 8px; border-radius: 6px;
              white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
  .row:hover .who, .row:focus .who { display: block; }
  .empty { color: var(--muted); font-size: .9rem; }
  form { margin-top: 16px; display: grid; gap: 10px; }
  input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--track); border-radius: 10px;
                     background: var(--bg); color: var(--text); font: inherit; }
  form button { padding: 10px; border: 0; border-radius: 10px; background: var(--accent); color: #fff;
                font: inherit; font-weight: 600; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: default; }
  .msg { font-size: .85rem; color: var(--muted); margin: 12px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Pau está de</h1>
  <div class="weeks"><span id="w"></span><small id="wd"></small></div>
  <div class="months" id="m"></div>
  <div class="bar"><div id="bar"></div></div>
  <div class="meta" id="meta"></div>
</main>

<main class="poll" id="poll">
  <h2>¿Querés sugerir algún nombre para el bebé?</h2>
  <p class="hint">Todavía no nos decidimos por un nombre para el bebé, pero este es el ranking entre nuestros amigos y familiares</p>
  <div id="ranking"><p class="empty">Cargando…</p></div>
  <form id="form" hidden>
    <p class="hint" style="margin:0">Tocá los nombres que te gusten para votarlos (tocá de nuevo para sacar el voto) o sugerí uno nuevo.</p>
    <input type="text" id="voter" placeholder="Tu nombre" maxlength="60" required autocomplete="name">
    <input type="text" id="suggest" placeholder="Sugerí otro nombre (opcional)" maxlength="40">
    <button id="send">Votar</button>
  </form>
  <p class="msg" id="msg"></p>
</main>
<script>
  // Fecha probable de parto; el inicio de la gestación se calcula como FPP − 280 días
  const FPP = new Date(2027, 2, 4);
  const DAY = 86400000;
  const start = new Date(FPP.getTime() - 280 * DAY);
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const days = Math.round((today - start) / DAY);
  const weeks = Math.floor(days / 7);
  const extraDays = days % 7;

  // Meses calendario cumplidos desde el inicio, y semanas restantes
  let months = (today.getFullYear() - start.getFullYear()) * 12 + today.getMonth() - start.getMonth();
  if (today.getDate() < start.getDate()) months--;
  const monthMark = new Date(start.getFullYear(), start.getMonth() + months, start.getDate());
  const remWeeks = Math.floor(Math.round((today - monthMark) / DAY) / 7);

  const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
  document.getElementById('w').textContent = weeks;
  document.getElementById('wd').textContent =
    extraDays ? `semanas y ${plural(extraDays, 'día', 'días')}` : 'semanas';
  document.getElementById('m').textContent =
    `${plural(months, 'mes', 'meses')} y ${plural(remWeeks, 'semana', 'semanas')}`;
  document.getElementById('bar').style.width = Math.min(100, days / 280 * 100) + '%';

  const left = Math.round((FPP - today) / DAY);
  const fmt = d => d.toLocaleDateString('es-AR', { day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('meta').innerHTML =
    `Fecha probable de parto: ${fmt(FPP)}<br>` +
    (left > 0 ? `Faltan ${plural(left, 'día', 'días')}` : '¡Ya llegó la fecha!');
</script>
<script>
  const SUPABASE_URL = 'https://rackcpaqpoyedwdlriiu.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhY2tjcGFxcG95ZWR3ZGxyaWl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyOTEyMjUsImV4cCI6MjEwODg2NzIyNX0.1hAVlPuk3RQHAV0zIztDbtEYswW7ODj_PrWfkshJC1w';
  const API = `${SUPABASE_URL}/rest/v1/votos`;
  const HEADERS = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' };
  const VOTED_KEY = 'embarazo-voto';

  const $ = id => document.getElementById(id);
  const poll = $('poll'), form = $('form'), suggest = $('suggest'), msg = $('msg');
  const norm = s => s.trim().replace(/\s+/g, ' ');
  const selected = new Set();  // nombres de la lista elegidos, en minúsculas
  const joinNames = a => a.length > 1 ? `${a.slice(0, -1).join(', ')} y ${a.at(-1)}` : a[0];

  const getVoted = () => { try { return JSON.parse(localStorage.getItem(VOTED_KEY)); } catch { return null; } };
  const setVoted = v => { try { localStorage.setItem(VOTED_KEY, JSON.stringify(v)); } catch {} };

  function render(votes) {
    // Agrupa sin distinguir mayúsculas; se muestra la primera forma en que se escribió
    const groups = new Map();
    for (const v of votes) {
      const k = v.nombre.toLowerCase();
      if (!groups.has(k)) groups.set(k, { nombre: v.nombre, votantes: [] });
      groups.get(k).votantes.push(v.votante);
    }
    const list = [...groups.values()].sort((a, b) => b.votantes.length - a.votantes.length);
    const max = list[0]?.votantes.length || 1;

    const ranking = $('ranking');
    ranking.replaceChildren();
    if (!list.length) {
      ranking.innerHTML = '<p class="empty">Todavía no hay nombres. ¡Sugerí el primero!</p>';
      return;
    }
    for (const g of list) {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'row';
      row.innerHTML = '<div class="top"><b></b><span></span></div><div class="bar"><div></div></div><div class="who"></div>';
      row.querySelector('b').textContent = g.nombre;
      row.querySelector('.top span').textContent = g.votantes.length;
      row.querySelector('.bar div').style.width = (g.votantes.length / max * 100) + '%';
      row.querySelector('.who').textContent = g.votantes.join(', ');
      row.onclick = () => {
        if (!poll.classList.contains('voting')) return;
        const k = g.nombre.toLowerCase();
        selected.has(k) ? selected.delete(k) : selected.add(k);
        markSelected();
      };
      ranking.append(row);
    }
    markSelected();
  }

  function markSelected() {
    for (const r of document.querySelectorAll('.row'))
      r.setAttribute('aria-pressed', r.classList.toggle('sel', selected.has(r.querySelector('b').textContent.toLowerCase())));
  }

  function showVoted(v) {
    poll.classList.remove('voting');
    form.hidden = true;
    msg.textContent = `Gracias, ${v.votante}. Votaste por ${joinNames(v.nombres)}.`;
  }

  async function load() {
    try {
      const r = await fetch(`${API}?select=votante,nombre&order=creado`, { headers: HEADERS });
      if (!r.ok) throw new Error();
      render(await r.json());
    } catch {
      $('ranking').innerHTML = '<p class="empty">No se pudieron cargar los votos.</p>';
    }
  }

  form.onsubmit = async e => {
    e.preventDefault();
    const votante = norm($('voter').value);
    // Nombres elegidos con la forma en que aparecen en la lista, más el sugerido si no estaba
    const nombres = [...document.querySelectorAll('.row.sel b')].map(b => b.textContent);
    const nuevo = norm(suggest.value);
    if (nuevo && !nombres.some(n => n.toLowerCase() === nuevo.toLowerCase())) nombres.push(nuevo);
    if (!nombres.length) { msg.textContent = 'Elegí uno o más nombres de la lista, o sugerí uno nuevo.'; return; }
    const vote = { votante, nombres };
    $('send').disabled = true;
    msg.textContent = '';
    try {
      // Una persona vota una sola vez (aunque elija varios nombres)
      const q = await fetch(`${API}?select=id&limit=1&votante=ilike.${encodeURIComponent(votante.replace(/[%_*]/g, ''))}`, { headers: HEADERS });
      if (!q.ok) throw new Error();
      if ((await q.json()).length) { msg.textContent = `Ya hay un voto a nombre de ${votante}.`; return; }
      const rows = nombres.map(nombre => ({ votante, nombre }));
      const r = await fetch(API, { method: 'POST', headers: { ...HEADERS, Prefer: 'return=minimal' }, body: JSON.stringify(rows) });
      if (r.status === 409) { msg.textContent = `Ya hay un voto a nombre de ${votante}.`; return; }
      if (!r.ok) throw new Error();
      setVoted(vote);
      showVoted(vote);
      load();
    } catch {
      msg.textContent = 'No se pudo guardar el voto. Probá de nuevo.';
    } finally {
      $('send').disabled = false;
    }
  };

  const voted = getVoted();
  if (voted) showVoted(voted);
  else { poll.classList.add('voting'); form.hidden = false; }
  load();
</script>
</body>
</html>
